name: DevOps Monitoring Dashboard CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate deployment metadata
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B | tr -d '\n\r\"' | cut -c1-60)
          echo "Writing deployment metadata..."
          cat <<DEPLOY_EOF > backend/deployment.json
          {
            "status": "active",
            "environment": "production",
            "last_deployment": "$(date -u +'%Y-%m-%d %H:%M:%S UTC')",
            "commit_hash": "${{ github.sha }}",
            "commit_message": "$COMMIT_MSG",
            "branch": "${{ github.ref_name }}",
            "author": "${{ github.actor }}"
          }
          DEPLOY_EOF

      - name: Deploy via SSH and Rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USERNAME }}
        run: |
          # 1. Setup SSH connection details
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # 2. Ensure the remote directory exists
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $USER@$HOST "mkdir -p /home/ubuntu/intern"
          
          # 3. Rsync files to EC2 instance (excluding logs, node_modules, .terraform, and git/github metadata)
          echo "Syncing code files to EC2..."
          rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa" \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'logs/' \
            --exclude 'node_modules/' \
            --exclude '.terraform/' \
            --exclude '*.tfstate*' \
            ./ $USER@$HOST:/home/ubuntu/intern/
          
          # 4. SSH into instance and execute container rebuilds
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $USER@$HOST << 'EOF'
            set -e
            echo "Successfully connected to EC2 instance. Starting deployment..."
            
            # Go to deployment directory
            cd /home/ubuntu/intern
            
            # Ensure proper folder ownership
            chown -R ubuntu:ubuntu /home/ubuntu/intern
            
            # Restart Docker containers
            echo "Stopping old containers..."
            docker compose down --remove-orphans || true
            
            echo "Rebuilding and launching containers in background..."
            docker compose up --build -d
            
            # Print active containers
            docker compose ps
            
            echo "Deployment finished successfully!"
          EOF
